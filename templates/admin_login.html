<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Sanjeevani Clinic</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e8f5f1, #dbeafe);
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            margin: 20px;
            padding: 35px;
            border-radius: 18px;
            background: white;
            box-shadow: 0 12px 35px rgba(0,0,0,0.08);
        }

        h1 {
            margin-bottom: 8px;
            color: #166534;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin: 16px 0 7px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 24px;
            border: none;
            border-radius: 8px;
            background: #15803d;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #166534;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #error {
            color: #dc2626;
            margin-top: 15px;
        }

        .back-link {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #166534;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="login-card">

        <h1>Sanjeevani Admin</h1>

        <p class="subtitle">
            Authorized clinic staff only
        </p>

        <form id="adminLoginForm">

            <label for="username">Username</label>
            <input
                type="text"
                id="username"
                required
                autocomplete="username"
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                required
                autocomplete="current-password"
            >

            <button type="submit" id="loginButton">
                Login to Dashboard
            </button>

            <p id="error" role="alert"></p>

        </form>

        <a href="/" class="back-link">
            ← Back to Clinic
        </a>

    </div>

    <script>
        const form = document.getElementById("adminLoginForm");
        const errorElement = document.getElementById("error");
        const loginButton = document.getElementById("loginButton");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            errorElement.textContent = "";
            loginButton.disabled = true;

            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            try {
                const response = await fetch("/api/mcp/admin/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    credentials: "same-origin",
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                });

                if (!response.ok) {
                    throw new Error("Invalid username or password.");
                }

                const result = await response.json();

                if (result.success) {
                    window.location.href = "/api/mcp/admin/dashboard";
                } else {
                    errorElement.textContent = "Admin login failed.";
                }

            } catch (error) {
                errorElement.textContent = error.message;
            } finally {
                loginButton.disabled = false;
            }
        });
    </script>

</body>
</html>
